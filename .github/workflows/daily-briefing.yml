name: 데일리 브리핑

# 평일 07:00 KST = 전날 22:00 UTC.
# cron 요일은 0=일요일이므로 0-4(일~목) 22:00 UTC 가 월~금 07:00 KST 에 대응한다.
# 주말은 돌리지 않는다 — 장이 열리지 않아 공시·시세가 없고, UI 가 종목 전용이라
# 보여줄 내용이 없다 (docs/superpowers/specs/2026-08-22-daily-automation-design.md).
on:
  schedule:
    - cron: '0 22 * * 0-4'
  workflow_dispatch:

# 이전 실행이 아직 돌고 있으면 중복 실행하지 않는다. 같은 날짜 행을 두 프로세스가
# upsert 하면 결과가 뒤섞인다.
concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    # 실측 실행 시간 363~547초(6~9분). 네트워크 지연·LLM 재시도 여유를 둔다.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --frozen

      - name: dotenvx 설치
        run: npm i -g @dotenvx/dotenvx

      - name: Claude Code CLI 설치
        run: npm i -g @anthropic-ai/claude-code

      - name: 브리핑 실행
        env:
          # 암호화된 .env 는 저장소에 커밋돼 있고, 복호화 개인키만 시크릿으로 받는다.
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
          # Max 플랜 할당량 사용 (CLAUDE.md P2). ANTHROPIC_API_KEY 는 설정하지 않는다 —
          # 설정하면 Claude Code 가 Max 대신 API 과금으로 넘어간다.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: dotenvx run -- uv run python -m news_briefing morning

      - name: 실패 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-log
          path: data/briefing.log
          retention-days: 14
          if-no-files-found: ignore
